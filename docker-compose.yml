services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openfoodfacts
    ports:
      - "5433:5432"
    volumes:
      - openfoodfacts_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openfoodfacts"]
      interval: 1s
      timeout: 5s
      retries: 15
      start_period: 2s

volumes:
  openfoodfacts_pgdata:
